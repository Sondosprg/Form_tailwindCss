<!doctype html>
<html>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link href="./output.css" rel="stylesheet" />
    <title>Form</title>
  </head>
  <body>
    <div class="w-screen h-screen bg-gray-100 flex justify-center items-center">
      <form
        action=""
        class="bg-white h-90 w-80 space-y-4 rounded-md px-6 py-4 shadow-xl"
      >
        <div>
          <h3 class="font-semibold">Sign Up</h3>
          <p>
            Already have an account ?
            <a
              href="#"
              class="text-pink-500 text-sm font-semibold hover:underline"
              >Sign in</a
            >
          </p>
        </div>

        <div class="flex flex-col space-y-2">
          <label for="fullName" class="cursor-pointer text-sm"
            >Full name
            <span class="text-red-500">*</span>
          </label>
          <input
            id="fullName"
            type="text"
            class="rounded-md px-2 py-1 text-sm ring-2 ring-gray-100 focus:outline-none focus:ring-pink-400/50"
          />
        </div>

        <div class="flex flex-col space-y-2">
          <label for="email" class="cursor-pointer text-sm"
            >Email
            <span class="text-red-500">*</span>
          </label>
          <input
            id="email"
            type="email"
            class="rounded-md px-2 py-1 text-sm ring-2 ring-gray-100 focus:outline-none focus:ring-pink-400/50"
          />
        </div>

        <div class="flex flex-col space-y-2">
          <label for="password" class="cursor-pointer text-sm"
            >Password
            <span class="text-red-500">*</span>
          </label>

          <div class="relative">
            <input
              id="password"
              type="password"
              class="w-full rounded-md px-2 py-1 text-sm ring-2 ring-gray-100 focus:outline-none focus:ring-pink-400/50"
            />
            <svg
              onclick="
                password.type == 'password'
                  ? (password.type = 'text')
                  : (password.type = 'password')
              "
              xmlns="http://www.w3.org/2000/svg"
              fill="none"
              viewBox="0 0 24 24"
              stroke-width="1.5"
              stroke="currentColor"
              class="size-4 cursor-pointer active:scale-95 absolute right-3 top-[5.5px]"
            >
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M2.036 12.322a1.012 1.012 0 0 1 0-.639C3.423 7.51 7.36 4.5 12 4.5c4.638 0 8.573 3.007 9.963 7.178.07.207.07.431 0 .639C20.577 16.49 16.64 19.5 12 19.5c-4.638 0-8.573-3.007-9.963-7.178Z"
              />
              <path
                stroke-linecap="round"
                stroke-linejoin="round"
                d="M15 12a3 3 0 1 1-6 0 3 3 0 0 1 6 0Z"
              />
            </svg>
          </div>

          <button
            type="submit"
            class="rounded-md w-full bg-pink-400/50 py-2 font-semibold mt-2 cursor-pointer transition hover:bg-pink-400/80 active:scale-95 "
          >
            Create account
          </button>
        </div>
      </form>
    </div>
  </body>
</html>
